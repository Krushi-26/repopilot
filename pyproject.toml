[project]
name = "repopilot"
version = "0.1.0"
description = "A GitHub-native AI teammate: ask questions about a codebase with citations, and get automated PR reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local ONNX embeddings (~130 MB model download, no torch). Without it, retrieval is BM25-only.
vector = ["fastembed>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
repopilot = "repopilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
